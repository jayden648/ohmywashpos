user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;

    # Render terminates TLS at the load balancer and forwards plain HTTP
    # to $PORT. Tell Laravel the original scheme/host via headers.
    map $http_x_forwarded_proto $laravel_scheme {
        default $http_x_forwarded_proto;
        ""      http;
    }

    server {
        # Render injects $PORT at runtime; entrypoint.sh substitutes it.
        listen ${PORT:-8080};
        server_name _;

        root /var/www/html/public;
        index index.php;

        # Static assets straight from disk (includes the official PNG logo
        # at /images/ohmywash-logo.png, which is NOT part of Vite's build).
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ ^/index\.php(/|$) {
            include fastcgi_params;
            fastcgi_pass unix:/run/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTPS $https if_not_empty;
            fastcgi_param HTTP_X_FORWARDED_PROTO $laravel_scheme;
            fastcgi_read_timeout 120s;
        }

        location ~ /\. {
            deny all;
        }
    }
}
